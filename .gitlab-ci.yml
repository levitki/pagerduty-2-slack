# Manual dry-run job for testing
dry_run:
  extends: .rotate_template
  script:
    - chmod a+x push_into_slack_group.sh
    - |
      ./push_into_slack_group.sh \
        --dry-run \
        --verbose \
        $PRIMARY_SCHEDULE $SECONDARY_SCHEDULE "$SLACK_GROUP"
  when: manual
  only:
    - master
