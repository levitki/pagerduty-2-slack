variables:
  DOCKER_DRIVER: overlay
  # Use custom Docker image with pre-installed dependencies
  SYNC_IMAGE: alpine:3.19

stages:
  - test
  - execute

# Reusable before_script for installing dependencies
.install_dependencies: &install_dependencies
  - apk add --no-cache curl jq bash coreutils

# Test stage - validate script before execution
test:shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck push_into_slack_group.sh
  only:
    - merge_requests
    - master

test:unit:
  stage: test
  image: ${SYNC_IMAGE}
  before_script:
    - *install_dependencies
  script:
    - chmod a+x tests/test_script.sh
    - chmod a+x push_into_slack_group.sh
    - ./tests/test_script.sh
  only:
    - merge_requests
    - master

# Health check job - runs before sync to validate API connectivity
health_check:
  stage: test
  image: ${SYNC_IMAGE}
  before_script:
    - *install_dependencies
  script:
    - chmod a+x push_into_slack_group.sh
    - ./push_into_slack_group.sh --health-check
  only:
    - schedules
    - master
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure

# Common template for on-call rotation jobs
.rotate_template:
  stage: execute
  image: ${SYNC_IMAGE}
  before_script:
    - *install_dependencies
  script:
    - chmod a+x push_into_slack_group.sh
    # Use verbose mode for better debugging in CI logs
    - |
      ./push_into_slack_group.sh \
        --verbose \
        --cache-ttl 300 \
        --max-retries 3 \
        $PRIMARY_SCHEDULE $SECONDARY_SCHEDULE "$SLACK_GROUP"
  only:
    - schedules
    - master
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
  # Track job duration for monitoring
  after_script:
    - echo "Job completed in $SECONDS seconds"

# Option 1: Individual team jobs (backward compatible)
rotateOncallTeam_1:
  extends: .rotate_template
  variables:
    PRIMARY_SCHEDULE: "PXXXXXX"
    SECONDARY_SCHEDULE: "PYYYYYY"
    SLACK_GROUP: "Team_1 on-call"

rotateOncallTeam_2:
  extends: .rotate_template
  variables:
    PRIMARY_SCHEDULE: "PZZZZZZ"
    SECONDARY_SCHEDULE: "PUUUUUU"
    SLACK_GROUP: "Team_2 on-call"

